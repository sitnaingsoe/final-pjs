version: '3.8'

services:
  # The PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: nextjs_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # The Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Connection string for Prisma to connect to the 'db' container
      DATABASE_URL: "postgresql://postgres:password@db:5432/pos_db?schema=public"
      # JWT Secret (should match your .env or just use a random secure string here)
      JWT_SECRET: "your-super-secret-jwt-key"
    depends_on:
      - db
    # We can run migrations automatically on startup before running server.js
    command: >
      sh -c "npx prisma migrate deploy && node server.js"

volumes:
  postgres_data:
